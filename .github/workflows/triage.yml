# Triage a request when it is opened or edited: read the form fields, label chip:<PART>, link duplicates and
# existing drivers in one comment, flag a datasheet link that is not https on a vendor domain.
#
# Security: the issue text is untrusted. It reaches the script only through the event file
# ($GITHUB_EVENT_PATH), never through a ${{ }} expression in a run: step, and the script never runs, follows
# or echoes it. The job runs the default branch's code (issues events have no fork code) with GITHUB_TOKEN
# limited to reading contents and writing issues. No secrets, no third-party actions.
name: Triage

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage
    if: github.repository_owner == 'kokeb-labs-drivers'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/triage
      - name: Triage the issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I tools/triage/triage.py --event "$GITHUB_EVENT_PATH"
