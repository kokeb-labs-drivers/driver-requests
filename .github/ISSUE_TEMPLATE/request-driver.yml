name: Request a driver
description: Ask for a driver for a chip that has none yet. One chip per request.
title: "Driver: "
labels: ["driver-request"]
type: Driver request
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the request. Before you start, search the
        [open and closed requests](https://github.com/kokeb-labs-drivers/driver-requests/issues?q=is%3Aissue)
        and the [existing drivers](https://github.com/orgs/kokeb-labs-drivers/repositories?q=driver-).
        If the chip is already requested, add a 👍 to that issue instead of opening a new one.

        Link the datasheet, and the application notes and errata that go with it, on the vendor's own website.
        The more of the chip's public documents you supply, the sooner a driver can start: it is written from
        them and from nothing else. Do not attach a PDF or any other file, and never share a document under NDA
        or marked confidential: a driver is only written from public documents.
  - type: input
    id: part
    attributes:
      label: Part number
      description: >-
        The base part number as the vendor prints it, without the package or reel suffix
        (for example TMP117, not TMP117AIDRVR). Letters, digits, dot, dash and underscore only.
      placeholder: TMP117
    validations:
      required: true
  - type: input
    id: vendor
    attributes:
      label: Vendor
      placeholder: Texas Instruments
    validations:
      required: true
  - type: dropdown
    id: bus
    attributes:
      label: Bus
      description: The interface the driver would talk to. Pick the one you need first if the chip has several.
      options:
        - SPI
        - I2C
        - I3C
        - UART
        - CAN
        - 1-Wire
        - Analog (ADC)
        - GPIO only
        - Other
    validations:
      required: true
  - type: input
    id: datasheet
    attributes:
      label: Datasheet link
      description: >-
        An https link to the product page or the datasheet on the vendor's own website. No attachments, no file
        sharing sites, no pages behind a login.
      placeholder: https://www.ti.com/product/TMP117
    validations:
      required: true
  - type: textarea
    id: documents
    attributes:
      label: Application notes and errata
      description: >-
        One link per line, each on the vendor's own website: the programming or register guide, application
        notes the datasheet relies on, and the errata sheet. Write "none published" if the vendor has none.
      placeholder: |
        https://www.ti.com/lit/ug/sbou213/sbou213.pdf
        https://www.ti.com/lit/er/sbaz055/sbaz055.pdf
    validations:
      required: true
  - type: textarea
    id: prior
    attributes:
      label: Research and existing code
      description: >-
        Optional. Links that help someone understand the chip: a paper, a forum thread, a teardown, or a driver or
        project that already talks to it (say what its licence is). Links only, never pasted code: it is read as
        background and no code is copied from a project without a compatible licence.
      placeholder: https://github.com/example/tmp117-linux-driver (GPL-2.0)
  - type: textarea
    id: variants
    attributes:
      label: Variants and packages
      description: Other parts of the same family, address options or packages you care about (optional).
      placeholder: TMP116 as well; WSON package.
  - type: textarea
    id: features
    attributes:
      label: Features you need first
      description: >-
        Every driver covers the whole chip in the end; this sets the order. Name modes and functions, not code.
      placeholder: Continuous conversion at 1 Hz, alert pin, offset register.
    validations:
      required: true
  - type: dropdown
    id: targets
    attributes:
      label: Target MCU families
      description: Where you would run it. The drivers are portable; this decides which example comes first.
      multiple: true
      options:
        - ESP32 (ESP-IDF)
        - STM32
        - RP2040 / RP2350
        - nRF
        - Linux or another host
        - Other
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Optional. Help moves a request up the queue.
      options:
        - label: I can test it on hardware
        - label: I can review the pull request
        - label: I can write it from driver-template, with review
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I searched the existing requests and drivers
          required: true
        - label: >-
            The link points to a public page on the vendor's website, and I attached no file and no
            confidential or NDA document
          required: true
